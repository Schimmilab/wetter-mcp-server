name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest

      # Smoke-Test: startet den Server wirklich und spricht das MCP-Protokoll
      # (initialize -> initialized -> tools/list). Beantwortet die Frage, die
      # pytest hier NICHT beantwortet: laeuft der Server nach einer
      # Frischinstallation ueberhaupt?
      #
      # ANLASS: Am 30.07.2026 wurden sechs eigene MCP-Server auf ein neues SDK
      # umgestellt und gemerged; am 31.07. waren fuenf davon tot. Die CI hatte
      # nichts gemerkt, weil sie nur Tests laufen liess. Ein Server, dessen
      # Tools in Dekoratoren registriert werden, laesst sich importieren, ohne
      # zu starten - ein Import-Test ist deshalb zu schwach (Lernprotokoll 30.07.).
      #
      # --min-tools 3 statt 1: eine LEERE Tool-Liste ist die heimtueckischste
      # Variante - Server laeuft, Handshake klappt, kann aber nichts. Ohne
      # Untergrenze waere das ein bestandener Test.
      - name: MCP-Smoke (Server startet und liefert Tools)
        run: uv run python .github/scripts/mcp-smoke.py --min-tools 3 -- uv run wetter-mcp
